name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: input
    id: mac
    attributes:
      label: Mac model
      description: For example MacBook Pro (M4 Pro, 2024). Apple menu › About This Mac.
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      description: For example 27.0.1
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: VibeBattery version
      description: Shown in the app's Settings.
  - type: textarea
    id: status
    attributes:
      label: Output of `vbctl charge status`
      description: Run /Applications/VibeBattery.app/Contents/MacOS/vbctl charge status and paste the output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Steps to reproduce help a lot. Screenshots are welcome.
    validations:
      required: true
