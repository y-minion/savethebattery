name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem first, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like VibeBattery to do?
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you tried instead?
