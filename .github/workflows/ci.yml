name: macOS build and tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Test policies and stores
        run: swift test --disable-xctest
      - name: Smoke test scoped terminal sessions
        env:
          STB_LANG: en
        run: python3 scripts/smoke-sessions.py .build/debug/stb
      - name: Build app bundle
        run: scripts/build-app.sh
      - name: Check helper scripts
        run: sh -n scripts/install-helper.sh && sh -n scripts/uninstall-helper.sh && sh -n scripts/release.sh && sh -n scripts/install.sh && sh -n scripts/uninstall.sh && sh -n scripts/test-install.sh
      - name: Test the installer against a local release
        run: sh scripts/test-install.sh
      - name: Read charge limit (read-only, runner may report unsupported)
        env:
          STB_LANG: en
        run: '"dist/Save the Battery.app/Contents/MacOS/stb" charge status'
      - name: Read health report (read-only, runner may have no battery)
        env:
          STB_LANG: en
        run: '"dist/Save the Battery.app/Contents/MacOS/stb" health && "dist/Save the Battery.app/Contents/MacOS/stb" health --json'
      - name: Smoke test embedded release tool
        env:
          STB_LANG: en
        run: python3 scripts/smoke-sessions.py "dist/Save the Battery.app/Contents/MacOS/stb"
