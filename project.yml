# Generates SaveTheBattery.xcodeproj (committed). After editing, run: xcodegen generate
name: SaveTheBattery
options:
  developmentLanguage: en
  deploymentTarget: { macOS: "15.0" }
  projectFormat: xcode16_0
  createIntermediateGroups: true
packages:
  SaveTheBatteryKit: { path: . }
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MARKETING_VERSION: 0.2.0
    CURRENT_PROJECT_VERSION: "1"
  configs:
    Release:
      ARCHS: "$(ARCHS_STANDARD)"
      ONLY_ACTIVE_ARCH: NO
targets:
  # Named apart from the package's SaveTheBattery executable so the scheme builds the app bundle.
  SaveTheBatteryApp:
    type: application
    platform: macOS
    scheme: {}
    sources:
      - path: Sources/SaveTheBattery
      - path: scripts/install-helper.sh
        buildPhase: resources
      - path: scripts/uninstall-helper.sh
        buildPhase: resources
      - path: Resources/ko.lproj/Localizable.strings
        buildPhase: resources
      - path: Resources/ko.lproj/AppShortcuts.strings
        buildPhase: resources
    dependencies:
      - { package: SaveTheBatteryKit, product: BatteryCore }
      - { package: SaveTheBatteryKit, product: BatteryPlatform }
      - { target: stb, embed: true, copy: { destination: executables } }
      - { target: STBChargeHelper, embed: true, copy: { destination: executables } }
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: Save the Battery
        CFBundleDisplayName: Save the Battery
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ko]
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_NAME: "Save the Battery"
        PRODUCT_MODULE_NAME: SaveTheBattery
        PRODUCT_BUNDLE_IDENTIFIER: io.github.y-minion.savethebattery
        ENABLE_APP_SANDBOX: NO
  stb:
    type: tool
    platform: macOS
    sources: [Sources/BatteryCLI]
    dependencies:
      - { package: SaveTheBatteryKit, product: BatteryCore }
      - { package: SaveTheBatteryKit, product: BatteryPlatform }
      - { package: SaveTheBatteryKit, product: MacBridge }
    settings:
      base:
        PRODUCT_NAME: stb
        PRODUCT_BUNDLE_IDENTIFIER: io.github.y-minion.savethebattery.stb
  STBChargeHelper:
    type: tool
    platform: macOS
    sources: [Sources/STBChargeHelper]
    dependencies:
      - { package: SaveTheBatteryKit, product: BatteryCore }
      - { package: SaveTheBatteryKit, product: BatteryPlatform }
      - { package: SaveTheBatteryKit, product: MacBridge }
      - { sdk: SystemConfiguration.framework }
    settings:
      base:
        PRODUCT_NAME: STBChargeHelper
        PRODUCT_BUNDLE_IDENTIFIER: io.github.y-minion.savethebattery.helper
